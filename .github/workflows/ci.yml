name: CI

# CI (FIN-032): API contract tests (Testcontainers uses the runner's Docker)
# and web type/lint/build checks on every push and pull request.
on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API tests (mvn test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        run: mvn -B -ntp test

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: apps/api/target/surefire-reports
          retention-days: 7

  web:
    name: Web checks (tsc / lint / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      # Node 22 bundles npm 10.9.x, which intermittently crashes with
      # "Exit handler never called!" (npm/cli#7639); npm 11 fixes the race.
      - name: Upgrade npm
        run: npm install -g npm@11

      - name: Install dependencies
        run: |
          # The npm exit-handler bug above is flaky: retry once after a clean.
          npm ci --no-audit --no-fund || {
            echo "::warning::npm ci failed (known npm 'Exit handler never called!' bug); retrying"
            npm cache clean --force
            npm ci --no-audit --no-fund
          }

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  mcp:
    name: MCP server (tsc / test / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mcp
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/mcp/package-lock.json

      # Same npm exit-handler race as the web job (npm/cli#7639).
      - name: Upgrade npm
        run: npm install -g npm@11

      # A lockfile generated behind a mirror resolves tarballs at that host,
      # which a GitHub runner cannot reach.
      - name: Check the lockfile uses the public registry
        run: |
          bad="$(grep -o '"resolved": "https\?://[^/]*' package-lock.json | grep -v 'registry.npmjs.org' || true)"
          if [ -n "$bad" ]; then
            echo "::error::package-lock.json resolves through a mirror: $bad"
            echo "::error::regenerate it with npm install --package-lock-only --registry=https://registry.npmjs.org"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
