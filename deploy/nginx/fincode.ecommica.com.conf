# fincode.ecommica.com — FinCode website reverse proxy (FIN-032).
# Target: fincode-prod-web container on host port 3003.
#
# Rollout on the server (two steps, certificate first):
#   1. Bootstrap: deploy only the port-80 server block with the redirect
#      replaced by the same proxy_pass, then issue the certificate:
#        certbot certonly --webroot -w /var/www/letsencrypt \
#          -d fincode.ecommica.com
#   2. Install this full file as /etc/nginx/conf.d/fincode.ecommica.com.conf,
#      run `nginx -t && nginx -s reload`.
# Renewals keep working through the ACME location on port 80 (webroot).

server {
    listen 80;
    server_name fincode.ecommica.com;

    # ACME HTTP-01 challenges for certbot webroot renewals.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name fincode.ecommica.com;

    ssl_certificate /etc/letsencrypt/live/fincode.ecommica.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fincode.ecommica.com/privkey.pem;

    access_log /var/log/nginx/fincode.ecommica.com_access.log main;
    error_log /var/log/nginx/fincode.ecommica.com_error.log warn;

    # Portal forms are small JSON payloads.
    client_max_body_size 2m;

    # Compress HTML / JS / CSS / JSON / SVG responses.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 1024;

    # Next.js hashed static assets are immutable: cache hard for a year.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3003;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Optimized images served by /_next/image can be cached at the edge too.
    location /_next/image {
        proxy_pass http://127.0.0.1:3003;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Next.js needs the public scheme to build absolute URLs/redirects.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
