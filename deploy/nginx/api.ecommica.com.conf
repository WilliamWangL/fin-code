# api.ecommica.com — FinCode API reverse proxy (FIN-032).
# Target: fincode-prod-api container on host port 8081.
#
# Rollout on the server (two steps, certificate first):
#   1. Bootstrap: deploy only the port-80 server block with the redirect
#      replaced by the same proxy_pass, then issue the certificate:
#        certbot certonly --webroot -w /var/www/letsencrypt \
#          -d api.ecommica.com
#   2. Install this full file as /etc/nginx/conf.d/api.ecommica.com.conf,
#      run `nginx -t && nginx -s reload`.
# Renewals keep working through the ACME location on port 80 (webroot).

server {
    listen 80;
    server_name api.ecommica.com;

    # ACME HTTP-01 challenges for certbot webroot renewals.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name api.ecommica.com;

    ssl_certificate /etc/letsencrypt/live/api.ecommica.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.ecommica.com/privkey.pem;

    access_log /var/log/nginx/api.ecommica.com_access.log main;
    error_log /var/log/nginx/api.ecommica.com_error.log warn;

    # Webhook payloads are small JSON documents; 10m is plenty.
    client_max_body_size 10m;

    # Compress API JSON responses.
    gzip on;
    gzip_types application/json;
    gzip_min_length 1024;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
