name: fincode-prod

# Production stack (FIN-032) deployed by .github/workflows/deploy.yml to
# /opt/fincode on the server. MySQL and Redis stay on the internal compose
# network only; api and web are the sole entry points:
#   - web: host 3003 -> container 3000
#   - api: host 8081 -> container 8080
# Ports 80/443 (nginx), 3000/3001/3002/48080, 3306/3307/6379/6380/5432 are
# already taken by other services on this host and must not be reused.

services:
  mysql:
    image: mysql:8.0
    container_name: fincode-prod-mysql
    restart: always
    environment:
      MYSQL_DATABASE: fincode
      MYSQL_USER: fincode
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: UTC
    command:
      # UTF8MB4 + UTC are mandatory (spec §21)
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - fincode

  redis:
    image: redis:7-alpine
    container_name: fincode-prod-redis
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fincode

  api:
    image: ghcr.io/williamwangl/fin-code/fincode-api:latest
    container_name: fincode-prod-api
    restart: always
    ports:
      - "0.0.0.0:8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:mysql://mysql:3306/fincode?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
      DATABASE_USERNAME: fincode
      DATABASE_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      # PayPal billing stays disabled until real credentials are provided.
      PAYPAL_ENV: ${PAYPAL_ENV:-sandbox}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID:-}
      PAYPAL_PLAN_DEVELOPER: ${PAYPAL_PLAN_DEVELOPER:-}
      PAYPAL_PLAN_STARTUP: ${PAYPAL_PLAN_STARTUP:-}
      PAYPAL_PLAN_BUSINESS: ${PAYPAL_PLAN_BUSINESS:-}
      TZ: UTC
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      - fincode

  web:
    image: ghcr.io/williamwangl/fin-code/fincode-web:latest
    container_name: fincode-prod-web
    restart: always
    ports:
      - "0.0.0.0:3003:3000"
    environment:
      NODE_ENV: production
      TZ: UTC
    depends_on:
      api:
        condition: service_healthy
    networks:
      - fincode

volumes:
  mysql_data:
  redis_data:

networks:
  fincode:
    driver: bridge
