name: fincode-prod

# Production stack (FIN-032) deployed by .github/workflows/deploy.yml to
# /opt/fincode on the server. MySQL is the host's own systemd mysqld (the
# `fincode` database and `fincode`@`%` account live there; Flyway creates the
# schema on boot), reached through host-gateway exactly like the river stack.
# Redis stays containerized on the internal network. Entry points:
#   - web: host 3003 -> container 3000
#   - api: host 8081 -> container 8080
# Ports 80/443 (nginx), 3000/3001/3002/48080, 3306/6379/5432 are already
# taken by other services on this host and must not be reused.

services:
  redis:
    image: redis:7-alpine
    container_name: fincode-prod-redis
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fincode

  api:
    image: ghcr.io/williamwangl/fin-code/fincode-api:latest
    container_name: fincode-prod-api
    restart: always
    ports:
      - "0.0.0.0:8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # Host mysqld via host-gateway (same pattern as the river stack).
      DATABASE_URL: jdbc:mysql://host.docker.internal:3306/fincode?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
      DATABASE_USERNAME: fincode
      DATABASE_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      # PayPal billing stays disabled until real credentials are provided.
      PAYPAL_ENV: ${PAYPAL_ENV:-sandbox}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID:-}
      PAYPAL_PLAN_DEVELOPER: ${PAYPAL_PLAN_DEVELOPER:-}
      PAYPAL_PLAN_STARTUP: ${PAYPAL_PLAN_STARTUP:-}
      PAYPAL_PLAN_BUSINESS: ${PAYPAL_PLAN_BUSINESS:-}
      TZ: UTC
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      - fincode

  web:
    image: ghcr.io/williamwangl/fin-code/fincode-web:latest
    container_name: fincode-prod-web
    restart: always
    ports:
      - "0.0.0.0:3003:3000"
    environment:
      NODE_ENV: production
      TZ: UTC
    depends_on:
      api:
        condition: service_healthy
    networks:
      - fincode

volumes:
  redis_data:

networks:
  fincode:
    driver: bridge
